# Explicit H2 Development/Testing Profile Configuration
# To activate: set SPRING_PROFILES_ACTIVE=h2 or pass --spring.profiles.active=h2

spring.datasource.url=jdbc:h2:mem:zipurldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

